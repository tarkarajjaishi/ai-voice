; ═══════════════════════════════════════════════════════════════════════════
; Ncell SIP trunk — E-Digital Nepal Pvt. Ltd. (DGT86USV01, VLAN 3030)
;
; DEPLOY ON THE ON-PREM BOX ONLY. This cannot work anywhere else: the trunk is a
; private L2/L3 handoff on VLAN 3030, so the machine must physically hold
; 10.111.7.76 on that VLAN. Verified from the dev box — 10.111.7.73 routes out
; the default gateway and is unreachable, as are Ncell's public signalling IPs.
;
; Include from /etc/asterisk/pjsip.conf:
;     #include "pjsip_ncell.conf"
; ═══════════════════════════════════════════════════════════════════════════

; ── Transport ───────────────────────────────────────────────────────────────
; Ncell enforces the SOURCE IP ("Request should come from provided IP with
; default sig port 5060"), so we must bind our allocated address explicitly —
; binding 0.0.0.0 risks sourcing from the wrong interface on a multi-homed box
; and Ncell will silently drop it.
[transport-ncell]
type = transport
protocol = udp
bind = 10.111.7.76:5060
local_net = 10.111.7.72/29

; ── Trunk endpoint ──────────────────────────────────────────────────────────
[ncell-trunk]
type = endpoint
transport = transport-ncell
context = from-ncell
aors = ncell-trunk

; The sheet specifies G729 on both sides.
; ⚠ Stock Asterisk can PASS G729 THROUGH but CANNOT TRANSCODE it — there is no
;   g729 row in `core show translation` and no codec module ships for it. The AI
;   pipeline needs signed-linear PCM, so with G729 alone the agent hears nothing.
;   Resolve ONE of these before go-live:
;     (a) ask Ncell to enable G711 alaw (PCMA) — a config change on their side,
;         and the single biggest ASR accuracy win available; then swap the
;         allow= line below to `alaw`, or
;     (b) build codec_bcg729 against libbcg729 (libbcg729-dev IS in apt) and
;         confirm a g729 row appears in `core show translation`.
disallow = all
allow = g729
; allow = alaw          ; ← preferred: uncomment if Ncell enables G711

; Out-of-band DTMF per the spec. This is what makes keypad capture reliable for
; numeric fields, which is the mitigation for Nepali ASR on digits.
dtmf_mode = rfc4733

; Media must flow through Asterisk — Stasis/AudioSocket cannot bridge a call
; whose RTP goes endpoint-to-endpoint.
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = no          ; carrier trunk: trust the configured contact
from_domain = 10.111.7.76

; 15 channels is the hard ceiling from the order. Asterisk enforces it here so
; an outbound campaign can never starve inbound calls.
device_state_busy_at = 15

[ncell-trunk]
type = aor
contact = sip:10.111.7.73:5060
qualify_frequency = 60        ; OPTIONS keepalive so we see the trunk drop

; ── Identify: match inbound by IP, not by registration ──────────────────────
; Carrier trunks authenticate by source IP — there is no username/password, so
; there is deliberately NO [ncell-trunk] type=auth section here.
[ncell-trunk]
type = identify
endpoint = ncell-trunk
match = 10.111.7.73           ; Ncell gateway (private handoff)
match = 116.68.210.56         ; signalling — KTM
match = 116.68.213.56         ; signalling — POK
match = 116.68.210.57         ; RTP — KTM
match = 116.68.210.58         ; RTP
match = 116.68.210.59         ; RTP

; ⚠ OPEN QUESTION FOR NCELL: the order sheet lists their signalling and RTP as
;   PUBLIC addresses (116.68.210.x) while our side is PRIVATE (10.111.7.76).
;   Confirm whether media actually lands on the public range or stays on the
;   private gateway — it decides the firewall rules and whether this box needs a
;   public address at all. Both are matched above so either path is accepted.
