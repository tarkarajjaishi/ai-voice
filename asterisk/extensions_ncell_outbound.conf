; ═══════════════════════════════════════════════════════════════════════════
; Outbound dialling over the Ncell trunk — this is the "AI calls you back"
; half of the product (scheduled callbacks, campaigns).
;
; Include from /etc/asterisk/extensions.conf:
;     #include "extensions_ncell_outbound.conf"
;
; REQUIRES the on-prem box on VLAN 3030. There is no other route to the PSTN:
; Nepal terminates no VoIP without an NTA licence, and Twilio sells no
; voice-enabled Nepali numbers at all.
; ═══════════════════════════════════════════════════════════════════════════

[ncell-outbound]
; ── Nepali mobile, 10 digits (98/97/96 prefixes) ────────────────────────────
exten => _9[678]XXXXXXXX,1,NoOp(Outbound -> ${EXTEN} via Ncell)
 same => n,Set(CALLERID(num)=${NCELL_DID})
 ; Record outbound too: a callback the AI placed must be traceable to the
 ; inbound call that authorised it.
 same => n,MixMonitor(out-${UNIQUEID}.wav,ab)
 same => n,Dial(PJSIP/${EXTEN}@ncell-trunk,60)
 same => n,Hangup()

; ── Accept E.164 and country-code forms, normalise to 10 digits ─────────────
exten => _+977XXXXXXXXX,1,Goto(ncell-outbound,${EXTEN:4},1)
exten => _977XXXXXXXXX,1,Goto(ncell-outbound,${EXTEN:3},1)

; ── Landlines (01-4XXXXXX and friends) ──────────────────────────────────────
exten => _0[1-9]XXXXXX.,1,NoOp(Outbound landline -> ${EXTEN} via Ncell)
 same => n,Set(CALLERID(num)=${NCELL_DID})
 same => n,MixMonitor(out-${UNIQUEID}.wav,ab)
 same => n,Dial(PJSIP/${EXTEN}@ncell-trunk,60)
 same => n,Hangup()

; ═══════════════════════════════════════════════════════════════════════════
; AI-originated outbound: the agent places the call and talks when answered.
;
;   asterisk -rx "channel originate PJSIP/9865760285@ncell-trunk \
;                 extension 100@from-ai-agent"
;
; The far end answers -> the channel enters from-ai-agent -> Stasis -> the AI
; speaks. Nothing extra is needed here; from-ai-agent already handles it.
;
; ⚠ OUTBOUND MUST NEVER WRITE TO THE DATABASE. Someone answering a robocall and
;   saying "yes" is the weakest authorisation that exists. Outbound is read-only
;   and confirm-only by design.
;
; ⚠ CHANNEL BUDGET: the trunk is 15 channels TOTAL, shared with inbound. A
;   campaign that saturates it gives busy signals to real customers calling in.
;   Reserve headroom before dialling in bulk.
; ═══════════════════════════════════════════════════════════════════════════
