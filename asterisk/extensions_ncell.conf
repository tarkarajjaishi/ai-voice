; ═══════════════════════════════════════════════════════════════════════════
; Dialplan for inbound calls arriving on the Ncell trunk.
;
; Include from /etc/asterisk/extensions.conf:
;     #include "extensions_ncell.conf"
; ═══════════════════════════════════════════════════════════════════════════

[from-ncell]
; Every inbound DID lands here. Deliberately NO AudioSocket() call — AVA
; originates AudioSocket channels itself over ARI once it receives StasisStart.
; Invoking it from the dialplan fights the engine.
exten => _X.,1,NoOp(Ncell inbound: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CHANNEL(language)=ne)
 ; Recording every call is a product requirement (voice-authorised writes must
 ; link back to the audio that authorised them), and it is also the only way to
 ; build a real Nepali evaluation set from live G729 telephone audio.
 same => n,MixMonitor(${UNIQUEID}.wav,ab)
 same => n,Answer()
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

; Fallback: if the engine is down, do not drop the caller silently.
exten => _X.,n,NoOp(AI engine unavailable — falling through)
exten => h,1,NoOp(Ncell call ended: ${UNIQUEID})
